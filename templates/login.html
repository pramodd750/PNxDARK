{% extends "base.html" %}
{% block title %}Sign in — PN VPS{% endblock %}
{% block body %}
<div style="display:flex;align-items:center;justify-content:center;padding:60px 20px;min-height:calc(100vh - 240px);position:relative;z-index:1">
  <div style="width:100%;max-width:420px">
    <div style="text-align:center;margin-bottom:36px">
      <div class="eyebrow" style="justify-content:center">Secure access</div>
      <h1 style="font-size:48px">Welcome<br><span class="grad">back.</span></h1>
      <p class="muted" style="margin-top:14px">Sign in to your PN VPS panel</p>
    </div>

    <form class="surface" method="post" style="box-shadow:var(--shadow-md)">
      {% if error %}
      <div style="border:1px solid rgba(239,68,68,0.3);background:rgba(239,68,68,0.07);color:#b91c1c;padding:13px 16px;font-size:12px;letter-spacing:0.5px;margin-bottom:20px;border-radius:12px">
        ⚠ {{error}}
      </div>
      {% endif %}

      <label class="field">Username</label>
      <input name="username" placeholder="Enter your username" autofocus required style="margin-bottom:18px">

      <label class="field">Password</label>
      <input name="password" type="password" placeholder="••••••••" required style="margin-bottom:26px">

      <button class="btn btn-primary btn-block">Sign in →</button>

      <div style="text-align:center;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)">
        <p class="dim" style="font-size:10px">Owner & user accounts supported</p>
      </div>
    </form>
  </div>
</div>
{% endblock %}
